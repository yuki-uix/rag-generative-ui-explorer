name: Image experiment review page

on:
  push:
    branches: [main, codex/image-retrieval]
    paths:
      - 'apps/web/**'
      - 'eval/images/**'
      - 'eval/images-review/**'
      - 'packages/corpus/src/image*.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/image-review-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-review-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:images:check
      - run: pnpm --filter @rgux/web run typecheck
      - run: pnpm --filter @rgux/web run test
      - name: Build static observation browser
        run: pnpm web:review:build
        env:
          REVIEW_BASE_PATH: /rag-generative-ui-explorer/
          VITE_REVIEW_BUILD_SHA: ${{ github.sha }}
          VITE_REVIEW_IS_PR_PREVIEW: ${{ github.ref_name != 'main' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist-review
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
