name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Neither `pnpm -r <script>` nor `pnpm --filter <pkg> <script>` fails when a
      # package does not declare the script — both exit 0, and Scope counts the
      # packages the filter selected rather than the ones that ran. Without this,
      # a package can silently drop out of typecheck and test while CI stays green.
      - run: pnpm workspace:check
      - run: pnpm typecheck
      - run: pnpm test
      # The JSON Schemas are generated artifacts. This fails when they drift
      # from the Zod contracts, so the two can never disagree on main.
      - run: pnpm schemas:check
      # Note metadata and manifest freshness. Offline: canonical URL
      # reachability runs on its own schedule in link-check.yml, so a third
      # party's outage cannot block an unrelated merge.
      - run: pnpm corpus:validate
      # questions.jsonl is generated from eval/questions.ts with evidence
      # identifiers resolved. A stale artefact would resolve cleanly against
      # yesterday's chunk set and silently mismeasure recall.
      # The module is covered by tests; this runs the script itself, so a break
      # in argument handling or output shape is caught rather than assumed.
      - run: pnpm corpus:ingest > /dev/null
      # The retriever module is covered by tests; this runs the script itself
      # against a real query, so a break in argument handling or the
      # ingest-to-index wiring is caught rather than assumed.
      - run: pnpm retriever:search --query "nDCG" > /dev/null
      # The generation module is covered by tests, which never call a model.
      # This runs the script itself in dry-run: it needs no key and spends
      # nothing, while exercising argument handling, retrieval, and prompt
      # construction. `answer:ask` without the flag calls a model and cannot
      # run here — it would spend money on every pull request.
      - run: pnpm answer:check > /dev/null
      - run: pnpm eval:check
      - run: pnpm eval:validate
      # The app is typechecked and tested by the recursive runs above. This runs
      # the production build, which they do not: an app that compiles under tsc
      # can still fail to bundle for the Worker target, and that failure would
      # otherwise only appear at deploy time.
      # `test/evidence-fixture.test.ts` checks the artefact by re-ingesting, so
      # the generator that writes it is never executed. Running it here and
      # requiring no diff exercises the real entry point and re-checks the
      # artefact through it, rather than only through a reimplementation.
      - run: pnpm web:evidence:build
      - run: git diff --exit-code apps/web/fixtures/evidence.json
      - run: pnpm web:lint
      - run: pnpm web:build
      # The gate from #54: `@rgux/corpus` reads `knowledge/` with `node:fs`,
      # which neither the browser nor workerd has. A client component importing
      # it ships the reader silently — the build exits 0 — so this reads the
      # built bundles and fails on the package's string-literal markers, which
      # survive minification where identifiers and the `node:fs` specifier do
      # not. It runs after `web:build` because it scans `dist/`.
      - run: pnpm web:bundle:check
      # `web:deploy` cannot run here — it would publish on every pull request and
      # needs a Cloudflare token. Its dry-run can: it needs no credentials, uploads
      # nothing, and still validates the generated wrangler.json, the asset
      # directory, and the bundle size against the Workers limit.
      - run: pnpm web:deploy:check
